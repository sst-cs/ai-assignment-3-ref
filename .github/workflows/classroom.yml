name: Autograde Local Search Algorithms

on: [push, workflow_dispatch]

jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: write
      checks: write

    steps:
      - name: Checkout student submission
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the late-penalty can read the student's last code-commit date

      - name: Checkout hidden tests
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: sst-cs/ai-assignment-3-tests
          token: ${{ secrets.HIDDEN_TESTS_TOKEN }}
          path: hidden-tests

      - name: Verify hidden tests available
        run: |
          if [ ! -f hidden-tests/tests/test_search.py ]; then
            echo "::error title=Hidden tests missing::Could not fetch the hidden tests. The HIDDEN_TESTS_TOKEN org secret is missing or invalid (GitHub returns 'Bad credentials' when a token is expired/revoked). An org admin must update HIDDEN_TESTS_TOKEN and re-run. NOTE: template/-ref repos are expected to fail here."
            exit 1
          fi
          echo "Hidden tests present — proceeding."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: HC Basic Tests
        id: hc_basic
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'hc_basic'
          command: 'pytest hidden-tests/tests/test_search.py -k "hc_basic"'
          timeout: 10
          max-score: 1

      - name: HC Quality Tests
        id: hc_quality
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'hc_quality'
          command: 'pytest hidden-tests/tests/test_search.py -k "hc_quality"'
          timeout: 10
          max-score: 1

      - name: Random-Restart HC Tests
        id: rrhc
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'rrhc'
          command: 'pytest hidden-tests/tests/test_search.py -k "rrhc"'
          timeout: 30
          max-score: 2

      - name: SA Basic Tests
        id: sa_basic
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'sa_basic'
          command: 'pytest hidden-tests/tests/test_search.py -k "sa_basic"'
          timeout: 15
          max-score: 1

      - name: SA Correctness Tests
        id: sa_correct
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'sa_correct'
          command: 'pytest hidden-tests/tests/test_search.py -k "sa_correct"'
          timeout: 20
          max-score: 2

      - name: SA Determinism Tests
        id: sa_determinism
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'sa_determinism'
          command: 'pytest hidden-tests/tests/test_search.py -k "sa_determinism"'
          timeout: 20
          max-score: 1

      - name: Beam Search Tests
        id: beam
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'beam'
          command: 'pytest hidden-tests/tests/test_search.py -k "beam"'
          timeout: 30
          max-score: 2

      - name: Package Results
        id: package
        run: |
          HC_BASIC=$(echo "${{steps.hc_basic.outputs.result}}"     | base64 -d 2>/dev/null | jq '.tests[0].score // .score // 0')
          HC_QUAL=$(echo "${{steps.hc_quality.outputs.result}}"    | base64 -d 2>/dev/null | jq '.tests[0].score // .score // 0')
          RRHC=$(echo "${{steps.rrhc.outputs.result}}"             | base64 -d 2>/dev/null | jq '.tests[0].score // .score // 0')
          SA_BASIC=$(echo "${{steps.sa_basic.outputs.result}}"     | base64 -d 2>/dev/null | jq '.tests[0].score // .score // 0')
          SA_CORR=$(echo "${{steps.sa_correct.outputs.result}}"    | base64 -d 2>/dev/null | jq '.tests[0].score // .score // 0')
          SA_DET=$(echo "${{steps.sa_determinism.outputs.result}}" | base64 -d 2>/dev/null | jq '.tests[0].score // .score // 0')
          BEAM=$(echo "${{steps.beam.outputs.result}}"             | base64 -d 2>/dev/null | jq '.tests[0].score // .score // 0')

          TOTAL=$(( ${HC_BASIC:-0} + ${HC_QUAL:-0} + ${RRHC:-0} + ${SA_BASIC:-0} + ${SA_CORR:-0} + ${SA_DET:-0} + ${BEAM:-0} ))
          echo "Calculated Total Score: $TOTAL / 10"

          # ── Late-submission penalty (Assignment 3) ──────────────────────────
          #   on time  (<= 2026-06-07 11:59 PM PKT = 18:59 UTC) → full marks
          #   1-7 days late                                     → -40% flat (x0.6)
          #   > 7 days late (after 2026-06-14 11:59 PM PKT)     → zero credit
          DEADLINE_EPOCH=$(date -d "2026-06-07T18:59:00Z" +%s)
          ZERO_EPOCH=$(date -d "2026-06-14T18:59:00Z" +%s)
          LAST_CODE_ISO=$(git log --format="%cI" -- . ':(exclude).github/' 2>/dev/null | head -1)
          [ -z "$LAST_CODE_ISO" ] && LAST_CODE_ISO=$(git log -1 --format=%cI)
          LAST_CODE_EPOCH=$(date -d "$LAST_CODE_ISO" +%s 2>/dev/null || echo 0)
          if [ "$LAST_CODE_EPOCH" -gt "$ZERO_EPOCH" ]; then
            echo "VERY LATE >7 days (last code commit: $LAST_CODE_ISO) — zero credit"
            TOTAL=0
          elif [ "$LAST_CODE_EPOCH" -gt "$DEADLINE_EPOCH" ]; then
            echo "LATE 1-7 days (last code commit: $LAST_CODE_ISO) — applying -40% flat penalty"
            TOTAL=$(( TOTAL * 6 / 10 ))
            echo "Score after penalty: $TOTAL / 10"
          else
            echo "ON TIME (last code commit: $LAST_CODE_ISO) — no penalty"
          fi

          for i in $(seq 1 10); do
            STATUS="fail"; SCORE=0
            if [ $i -le $TOTAL ]; then STATUS="pass"; SCORE=1; fi
            JSON="{\"version\":1,\"status\":\"$STATUS\",\"max_score\":1,\"tests\":[{\"name\":\"Requirement $i\",\"status\":\"$STATUS\",\"score\":$SCORE,\"max_score\":1}]}"
            B64=$(echo -n "$JSON" | base64 -w 0)
            echo "R${i}_RESULTS=$B64" >> $GITHUB_ENV
          done

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        continue-on-error: true
        with:
          runners: r1,r2,r3,r4,r5,r6,r7,r8,r9,r10
